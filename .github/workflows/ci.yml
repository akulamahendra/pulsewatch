name: CI

# Linear: SHI-48 (pytest), SHI-49 (docker smoke test)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: hashFiles('Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pulsewatch:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name pw -p 8000:8000 pulsewatch:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && exit 0; sleep 1; done
          docker logs pw; exit 1
